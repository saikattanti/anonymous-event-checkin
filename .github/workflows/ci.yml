name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  compile-and-test:
    name: Compile contract & run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          # The `compact` CLI installs to ~/.local/bin; toolchain versions live in ~/.compact.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Compact compiler 0.31.1
        run: |
          compact update 0.31.1 || compact update
          compact --version

      - name: Compile Compact contract
        # The wasm backend is the portable choice in headless CI environments.
        env:
          COMPACT_BACKEND: wasm
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Type-check backend
        run: npm run typecheck

  frontend-build:
    name: Type-check & build frontend
    runs-on: ubuntu-latest
    needs: compile-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
