name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Compile, test, and build full stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Compact compiler 0.31.1
        run: |
          compact update 0.31.1 || compact update
          compact --version

      - name: Compile Compact contract
        env:
          COMPACT_BACKEND: wasm
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Type-check CLI
        run: npm run typecheck --workspace=@midnight-ntwrk/checkin-cli

      - name: Type-check UI
        run: npm run typecheck --workspace=@midnight-ntwrk/checkin-ui

      - name: Build UI
        run: npm run build --workspace=@midnight-ntwrk/checkin-ui
